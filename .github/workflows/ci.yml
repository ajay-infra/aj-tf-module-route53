name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Uncomment to enable CI on direct push to main
# on:
#   push:
#     branches: [main]

env:
  TF_VERSION: "1.10.5"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init (dry run)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: TFLint
        run: tflint --init && tflint --format compact

  plan-dry-run:
    name: Plan (dry run)
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # The apex and one stage zone — the two shapes this module has. No
        # data sources, so each is a real diff with dummy credentials.
        tfvars: [example.tfvars, envs/apex.tfvars, envs/nonprod.tfvars]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init (dry run)
        run: terraform init -backend=false
      - name: Plan (dry run) — ${{ matrix.tfvars }}
        run: terraform plan -var-file=${{ matrix.tfvars }} -no-color | tee plan.txt
      - name: Every planned zone is protected from destroy
        # prevent_destroy is the module's own guardrail against re-issuing a
        # zone's name servers. Assert the plan shows the zone, not just that
        # it ran.
        run: grep -q 'aws_route53_zone.this will be created' plan.txt
      - name: The apex plan has the shape protect-dns assumes
        # protect-dns exempts exactly one role by name; the apex plan must
        # create it, and must create no record that is not NS or DS. A plan
        # that ran is not a plan that has the right shape.
        if: matrix.tfvars == 'envs/apex.tfvars'
        run: |
          grep -q 'aws_iam_role.pipeline\[0\] will be created' plan.txt || { echo "::error::apex plan does not create the pipeline role protect-dns exempts"; exit 1; }
          if grep -qE 'type\s+= "(A|AAAA|CNAME|TXT|MX|SRV)"' plan.txt; then echo "::error::apex plan writes a non-delegation record"; exit 1; fi
          echo "apex: pipeline role present, delegation records only"
      - name: A stage zone plan creates no apex-only resources
        if: matrix.tfvars != 'envs/apex.tfvars'
        run: |
          if grep -qE 'aws_iam_role\.pipeline' plan.txt; then echo "::error::a non-apex plan creates the pipeline role"; exit 1; fi
          echo "stage zone: no apex-only resources"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

